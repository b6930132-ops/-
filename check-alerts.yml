name: Check stock alerts

on:
  schedule:
    # Runs every 30 minutes. GitHub may delay this slightly during busy
    # periods — that's normal and fine for this use case.
    - cron: '*/30 * * * *'
  workflow_dispatch: {}
    # ^ lets you trigger it manually from the Actions tab to test it

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run alert checker
        run: node check-alerts.js
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
